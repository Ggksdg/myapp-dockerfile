server {
    listen 80;
    server_name localhost;

    # 1. Раздача фронтенда (HTML-страницы)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 2. Проксирование запросов к бэкенду
    # Перенаправляем /entries, а также /add (он тоже нужен вашему приложению)
    location ~ ^/(entries|add|health) {
        proxy_pass http://backend:8080;
        
        # Передаем правильные заголовки, чтобы бэкенд знал реальный IP клиента
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
